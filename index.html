<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111012">
  <meta name="description" content="Custom nail art for main-character energy. Explore nail sets, find your length, and book your next appointment.">
  <title>SET STUDIO — Nails That Do The Talking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --page: #111012;
      --page-raised: #181619;
      --surface: #201d21;
      --surface-raised: #29252a;
      --text: #fff8fc;
      --muted: #b7adb5;
      --subtle: #827781;
      --line: rgba(255, 248, 252, .13);
      --pink: #ff4fa3;
      --pink-bright: #ff73b5;
      --pink-wash: rgba(255, 79, 163, .12);
      --lime: #d4ff69;
      --chrome: #d8d1db;
      --hero-glow: rgba(255, 79, 163, .13);
      --card-shadow: 0 18px 48px rgba(0, 0, 0, .2);
      --margin-page: 20px;
      --gap-card: 12px;
      --padding-card: 20px;
      --radius-card: 20px;
      --font-display: "Syne", "Arial Black", sans-serif;
      --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="light"] {
      color-scheme: light;
      --page: #fff8fb;
      --page-raised: #fff0f6;
      --surface: #ffffff;
      --surface-raised: #fff4f9;
      --text: #20161d;
      --muted: #655760;
      --subtle: #887783;
      --line: rgba(54, 31, 44, .14);
      --pink: #dc1975;
      --pink-bright: #f13991;
      --pink-wash: rgba(220, 25, 117, .09);
      --lime: #b1df42;
      --chrome: #726672;
      --hero-glow: rgba(255, 79, 163, .18);
      --card-shadow: 0 18px 48px rgba(111, 44, 80, .08);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
      background: var(--page);
    }

    body {
      min-width: 320px;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 80% 4%, var(--hero-glow), transparent 35rem),
        var(--page);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    a {
      text-decoration: none;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    img,
    video {
      display: block;
      max-width: 100%;
    }

    .skip-link {
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 8px;
      padding: 10px 14px;
      transform: translateY(-150%);
      border-radius: 12px;
      background: var(--text);
      color: var(--page);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .announcement {
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, .14);
      background: var(--pink);
      color: #190d14;
    }

    .marquee {
      display: flex;
      width: max-content;
      min-height: 36px;
      align-items: center;
      animation: marquee 25s linear infinite;
    }

    .marquee__group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 28px;
      padding-right: 28px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .11em;
      white-space: nowrap;
    }

    @keyframes marquee {
      to { transform: translateX(-50%); }
    }

    .site-header {
      position: relative;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--page) 82%, transparent);
      backdrop-filter: saturate(160%) blur(18px);
      -webkit-backdrop-filter: saturate(160%) blur(18px);
    }

    .nav {
      display: flex;
      width: min(100% - 2 * var(--margin-page), 1240px);
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1;
    }

    .wordmark__spark {
      color: var(--pink);
      font-size: 23px;
      line-height: .8;
    }

    .nav__links {
      display: none;
      align-items: center;
      gap: 30px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .nav__links a,
    .footer__links a {
      transition: color .2s ease;
    }

    .nav__links a:hover,
    .footer__links a:hover {
      color: var(--pink);
    }

    .nav__actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle,
    .nav__book {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      transition: transform .2s ease, background-color .2s ease, border-color .2s ease;
    }

    .theme-toggle {
      width: 44px;
      padding: 0;
      cursor: pointer;
      font-size: 18px;
    }

    .nav__book {
      padding: 0 16px;
      border-color: var(--pink);
      background: var(--pink);
      color: #190d14;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .theme-toggle:hover,
    .nav__book:hover {
      transform: translateY(-2px);
    }

    .container {
      width: min(100% - 2 * var(--margin-page), 1240px);
      margin-inline: auto;
    }

    .hero {
      position: relative;
      display: grid;
      align-items: center;
      gap: 44px;
      padding-block: 56px 76px;
    }

    .hero__copy {
      max-width: 650px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--pink-bright);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 14px color-mix(in srgb, var(--lime) 70%, transparent);
      content: "";
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
    }

    h1 {
      max-width: 740px;
      margin-bottom: 20px;
      font-size: clamp(3.25rem, 13vw, 7.3rem);
      font-weight: 800;
      letter-spacing: -.085em;
      line-height: .91;
    }

    h1 span {
      color: var(--pink);
    }

    .hero__description {
      max-width: 460px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.65;
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--pink);
      color: #190d14;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .045em;
      text-align: center;
      transition: transform .22s cubic-bezier(.34, 1.56, .64, 1), box-shadow .22s ease, background-color .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button:hover {
      transform: translateY(-3px);
      background: var(--pink-bright);
      box-shadow: 0 10px 32px rgba(255, 79, 163, .26);
    }

    .button:active {
      transform: scale(.98);
    }

    .button:focus-visible,
    .theme-toggle:focus-visible,
    .nav a:focus-visible,
    summary:focus-visible,
    .footer a:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 4px;
    }

    .button--pulse {
      animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 79, 163, .35); }
      50% { box-shadow: 0 0 0 10px rgba(255, 79, 163, 0); }
    }

    .hero__note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .hero__note i {
      color: var(--lime);
      font-size: 16px;
    }

    .hero__visual {
      position: relative;
      width: min(100%, 390px);
      justify-self: center;
      padding: 12px;
      border: 1px solid color-mix(in srgb, var(--chrome) 35%, transparent);
      border-radius: 30px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(135deg, #30222d, #121014 62%, #392232);
      box-shadow: 0 26px 80px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255,255,255,.19);
    }

    [data-theme="light"] .hero__visual {
      background:
        linear-gradient(145deg, rgba(255,255,255,.7), transparent 35%),
        linear-gradient(135deg, #f9dce9, #f8edf3 62%, #f2c9de);
      box-shadow: 0 26px 80px rgba(111, 44, 80, .15), inset 0 1px 0 rgba(255,255,255,.9);
    }

    .video-placeholder {
      position: relative;
      display: flex;
      min-height: 450px;
      overflow: hidden;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 22px;
      background:
        radial-gradient(ellipse at 70% 37%, rgba(255, 79, 163, .48), transparent 29%),
        radial-gradient(ellipse at 20% 80%, rgba(212, 255, 105, .19), transparent 27%),
        linear-gradient(160deg, #261621 0%, #100e12 60%, #1e1720 100%);
      text-align: center;
    }

    [data-theme="light"] .video-placeholder {
      border-color: rgba(87, 37, 66, .16);
      background:
        radial-gradient(ellipse at 70% 37%, rgba(220, 25, 117, .25), transparent 29%),
        radial-gradient(ellipse at 20% 80%, rgba(177, 223, 66, .34), transparent 27%),
        linear-gradient(160deg, #f4ccdf 0%, #f9edf3 60%, #ecd5e2 100%);
    }

    .video-placeholder::before,
    .video-placeholder::after {
      position: absolute;
      width: 210px;
      height: 210px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      content: "";
    }

    .video-placeholder::before {
      top: 12%;
      right: -20%;
    }

    .video-placeholder::after {
      bottom: 6%;
      left: -23%;
      width: 170px;
      height: 170px;
      border-color: rgba(255, 79, 163, .38);
    }

    [data-theme="light"] .video-placeholder::before {
      border-color: rgba(53, 23, 41, .15);
    }

    [data-theme="light"] .video-placeholder::after {
      border-color: rgba(220, 25, 117, .32);
    }

    .video-placeholder__label {
      position: absolute;
      z-index: 1;
      top: 18px;
      left: 18px;
      color: rgba(255,255,255,.78);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    [data-theme="light"] .video-placeholder__label {
      color: rgba(32, 22, 29, .65);
    }

    .video-placeholder__art {
      position: relative;
      display: flex;
      width: 100%;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 20px;
    }

    .nail {
      position: relative;
      width: clamp(37px, 11vw, 53px);
      height: clamp(112px, 31vw, 148px);
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 45% 45% 30% 30% / 24% 24% 16% 16%;
      background:
        linear-gradient(110deg, rgba(255,255,255,.72), transparent 28% 74%, rgba(255,255,255,.35)),
        linear-gradient(145deg, #ff82ba 4%, #fe3d92 52%, #9b205f 100%);
      box-shadow: 0 14px 30px rgba(0,0,0,.27), inset 0 2px 4px rgba(255,255,255,.5);
      transform: rotate(-18deg);
    }

    .nail:nth-child(2) {
      z-index: 2;
      transform: translateY(-17px) rotate(-7deg);
      background:
        linear-gradient(105deg, rgba(255,255,255,.8), transparent 27% 71%, rgba(255,255,255,.28)),
        linear-gradient(155deg, #f7f1ed 4%, #d6c9d3 48%, #827384 100%);
    }

    .nail:nth-child(3) {
      z-index: 3;
      transform: translateY(-24px) rotate(4deg);
      background:
        linear-gradient(105deg, rgba(255,255,255,.82), transparent 27% 71%, rgba(255,255,255,.28)),
        linear-gradient(155deg, #ffc0df 4%, #ff63ad 48%, #a5236a 100%);
    }

    .nail:nth-child(4) {
      z-index: 2;
      transform: translateY(-14px) rotate(13deg);
      background:
        linear-gradient(105deg, rgba(255,255,255,.75), transparent 27% 71%, rgba(255,255,255,.28)),
        linear-gradient(155deg, #e8ff9f 4%, #a7ce54 48%, #597326 100%);
    }

    .nail:nth-child(5) {
      transform: rotate(22deg);
    }

    .video-placeholder__play {
      position: absolute;
      z-index: 4;
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 50%;
      background: rgba(255,255,255,.19);
      color: #fff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .video-placeholder__caption {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 0 20px 22px;
      color: rgba(255,255,255,.88);
      font-size: 11px;
      font-weight: 600;
    }

    [data-theme="light"] .video-placeholder__caption {
      color: rgba(32, 22, 29, .7);
    }

    .video-placeholder__caption strong {
      display: block;
      margin-bottom: 3px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 17px;
      letter-spacing: -.04em;
    }

    [data-theme="light"] .video-placeholder__caption strong {
      color: var(--text);
    }

    .visual-sticker {
      position: absolute;
      z-index: 2;
      right: -8px;
      bottom: 54px;
      display: grid;
      width: 88px;
      height: 88px;
      place-items: center;
      padding: 10px;
      transform: rotate(9deg);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      background: var(--lime);
      color: #19200d;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .visual-index {
      position: absolute;
      top: 46px;
      left: -20px;
      z-index: 2;
      padding: 8px 12px;
      transform: rotate(-7deg);
      border: 1px solid color-mix(in srgb, var(--chrome) 40%, transparent);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      box-shadow: var(--card-shadow);
    }

    .section {
      padding-block: 68px;
      border-top: 1px solid var(--line);
    }

    .parallax-section {
      overflow: clip;
      border-top: 1px solid var(--line);
      background: var(--page-raised);
    }

    .parallax-section__inner {
      width: min(100% - 2 * var(--margin-page), 1240px);
      margin-inline: auto;
      padding-block: 68px;
    }

    .parallax-grid {
      display: grid;
      gap: var(--gap-card);
    }

    .parallax-card {
      position: relative;
      min-height: clamp(290px, 90vw, 430px);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid color-mix(in srgb, var(--chrome) 24%, var(--line));
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }

    .parallax-card__visual {
      position: absolute;
      z-index: 0;
      inset: -11%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-image: linear-gradient(145deg, #5a2848 0%, #241723 51%, #111012 100%), url("parallax%201.jpg");
      transform: translate3d(0, var(--parallax-y, 0px), 0) scale(1.08);
      will-change: transform;
    }

    .parallax-card__image {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-card);
      object-fit: cover;
      object-position: center;
    }

    .parallax-card:nth-child(1) .parallax-card__visual {
      background-image: linear-gradient(145deg, rgba(90, 40, 72, .78), rgba(36, 23, 35, .32) 52%, rgba(17, 16, 18, .2)), url("parallax%201.jpg");
    }

    .parallax-card:nth-child(2) .parallax-card__visual {
      background-image: linear-gradient(145deg, rgba(67, 44, 96, .74), rgba(34, 24, 42, .33) 55%, rgba(17, 16, 18, .18)), url("parallax%202.jpg");
    }

    .parallax-card:nth-child(3) .parallax-card__visual {
      background-image: linear-gradient(145deg, rgba(74, 81, 65, .76), rgba(32, 36, 28, .40) 55%, rgba(17, 16, 18, .18)), url("parallax%203.jpg");
    }

    [data-theme="light"] .parallax-card__visual {
      background-image: linear-gradient(145deg, rgba(239, 182, 209, .86), rgba(233, 204, 220, .62) 51%, rgba(210, 181, 200, .35)), url("parallax%201.jpg");
    }

    [data-theme="light"] .parallax-card:nth-child(2) .parallax-card__visual {
      background-image: linear-gradient(145deg, rgba(222, 198, 244, .86), rgba(229, 216, 237, .66) 55%, rgba(199, 182, 214, .36)), url("parallax%202.jpg");
    }

    [data-theme="light"] .parallax-card:nth-child(3) .parallax-card__visual {
      background-image: linear-gradient(145deg, rgba(220, 232, 183, .88), rgba(220, 225, 204, .66) 55%, rgba(193, 201, 173, .38)), url("parallax%203.jpg");
    }

    .parallax-card::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 9, 14, .02) 20%, rgba(15, 9, 14, .78) 100%);
      content: "";
    }

    [data-theme="light"] .parallax-card::after {
      background: linear-gradient(180deg, rgba(255, 248, 251, .02) 20%, rgba(40, 17, 32, .67) 100%);
    }

    .parallax-card__orb {
      position: absolute;
      z-index: 2;
      top: 15%;
      right: 10%;
      width: clamp(76px, 20vw, 128px);
      aspect-ratio: 1;
      transform: translate3d(0, var(--parallax-y, 0px), 0);
      border: 1px solid rgba(255, 255, 255, .56);
      border-radius: 50%;
      background:
        radial-gradient(circle at 31% 28%, rgba(255,255,255,.9), rgba(255,255,255,.15) 31%, transparent 66%),
        linear-gradient(135deg, rgba(255,255,255,.45), rgba(255,255,255,.04) 55%, rgba(255,79,163,.38));
      box-shadow: inset -14px -18px 38px rgba(17, 10, 17, .23), 0 24px 70px rgba(0,0,0,.17);
      backdrop-filter: blur(2px);
      opacity: .42;
      will-change: transform;
    }

    .parallax-card:nth-child(2) .parallax-card__orb {
      top: 25%;
      right: 13%;
      width: clamp(86px, 22vw, 142px);
      border-radius: 48% 52% 45% 55% / 52% 39% 61% 48%;
      background:
        radial-gradient(ellipse at 28% 25%, rgba(255,255,255,.8), rgba(255,255,255,.08) 37%, transparent 68%),
        linear-gradient(135deg, rgba(206,173,255,.55), rgba(255,255,255,.07) 55%, rgba(142,86,195,.45));
    }

    .parallax-card:nth-child(3) .parallax-card__orb {
      top: 17%;
      right: 15%;
      width: clamp(80px, 21vw, 132px);
      border-radius: 42% 58% 55% 45% / 44% 39% 61% 56%;
      background:
        radial-gradient(ellipse at 28% 25%, rgba(255,255,255,.8), rgba(255,255,255,.08) 37%, transparent 68%),
        linear-gradient(135deg, rgba(229,255,164,.58), rgba(255,255,255,.07) 55%, rgba(110,136,63,.45));
    }

    .parallax-card__orb {
      pointer-events: none;
    }

    .parallax-card__copy {
      position: absolute;
      z-index: 3;
      right: 20px;
      bottom: 22px;
      left: 20px;
      color: #fff8fc;
    }

    .parallax-card__label {
      margin-bottom: 8px;
      color: rgba(255, 248, 252, .76);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .parallax-card__copy h3 {
      margin-bottom: 5px;
      font-size: clamp(1.7rem, 7vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1;
    }

    .parallax-card__copy p:last-child {
      margin: 0;
      color: rgba(255, 248, 252, .82);
      font-size: 12px;
    }

    .section__heading {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 28px;
    }

    .section__kicker {
      margin: 0;
      color: var(--pink-bright);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
